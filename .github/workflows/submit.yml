name: Submit to Web Store

# Builds, packages and (optionally) publishes the extension.
#
# Triggers
#   - push a version tag (e.g. v1.1.0) -> builds and publishes
#   - manual run                       -> builds, and only publishes when the
#                                         "publish" box is ticked. Leave it
#                                         unticked to get a downloadable zip
#                                         you can upload by hand first.
#
# Required repository secret: SUBMIT_KEYS
#   {
#     "$schema": "https://raw.githubusercontent.com/PlasmoHQ/bpp/v3/keys.schema.json",
#     "chrome": {
#       "clientId": "...",
#       "clientSecret": "...",
#       "refreshToken": "...",
#       "extId": "..."
#     }
#   }
#   See https://docs.plasmo.com/framework/workflows/submit for how to mint these.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Chrome Web Store (leave off to only build a zip)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    name: Build & submit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the extension
        run: pnpm build

      - name: Package the extension into a zip artifact
        run: pnpm package

      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod.zip
          if-no-files-found: error

      # bpp always publishes, so gate the whole step instead.
      - name: Browser Platform Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: build/chrome-mv3-prod.zip
          verbose: true
